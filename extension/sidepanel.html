<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeChef Copilot Side Panel</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --success-hover: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 12px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Auto-Pilot Box */
    .autopilot-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.15));
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .autopilot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .autopilot-title {
      font-size: 12px;
      font-weight: 700;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-auto-solve {
      padding: 10px 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }

    .btn-auto-solve:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    .btn-auto-solve.submit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-auto-solve.submit:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
    }

    .autopilot-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .btn-next-step {
      padding: 5px 10px;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-next-step:hover {
      background: #334155;
      border-color: #60a5fa;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }

    /* Key Config */
    .key-details {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }

    .key-details summary {
      cursor: pointer;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Problem Card */
    .problem-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .problem-title {
      font-weight: 600;
      font-size: 13px;
      color: #fff;
    }

    .problem-code {
      font-size: 10px;
      font-weight: 700;
      background: #1e293b;
      color: #93c5fd;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .lang-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.3);
      margin-top: 4px;
    }

    .btn-sync {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      margin-top: 8px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px dashed #334155;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sync:hover {
      background: #334155;
      color: #fff;
    }

    /* Actions grid */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .action-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #334155;
      border-color: var(--primary);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .content-area pre {
      background: #0b1120;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 11px;
      color: #e2e8f0;
      margin-top: 6px;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
    }

    .hint-card {
      background: #0f172a;
      border-left: 3px solid var(--primary);
      padding: 8px 10px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 8px;
    }

    .hint-level {
      font-size: 10px;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .app-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .app-link:hover {
      text-decoration: underline;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">CC</div>
      <div class="brand-title">CodeChef Copilot</div>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <!-- API Key Setting Drawer -->
  <details class="key-details">
    <summary>🔑 AI Model Key (Gemini / OpenAI)</summary>
    <div style="display: flex; gap: 4px; margin-top: 6px;">
      <input type="password" id="inputApiKey" placeholder="Paste Gemini or OpenAI Key..." style="flex: 1; background: #0b1120; border: 1px solid #1e293b; color: white; padding: 4px 6px; border-radius: 4px; font-size: 11px;">
      <button id="btnSaveKey" style="background: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: 600;">Save</button>
    </div>
    <div id="keySavedMsg" style="color: #34d399; font-size: 10px; margin-top: 2px; display: none;">Key saved to backend!</div>
  </details>

  <!-- Auto-Pilot Control Card -->
  <div class="autopilot-box">
    <div class="autopilot-header">
      <span class="autopilot-title">
        <span>⚡</span> AUTO-PILOT SOLVER
      </span>
      <span id="autoPilotStatus" style="font-size: 10px; color: #94a3b8;">Ready</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button id="btnAutoSolveRun" class="btn-auto-solve" style="flex: 1;">
        <span>⚡</span> Auto-Solve & Run
      </button>
      <button id="btnAutoSolveSubmit" class="btn-auto-solve submit" style="flex: 1;">
        <span>🚀</span> Submit
      </button>
    </div>
    <div class="autopilot-controls">
      <label class="checkbox-label">
        <input type="checkbox" id="chkAutoNext" checked>
        <span>Auto-Next when passed</span>
      </label>
      <button id="btnNext" class="btn-next-step">
        <span>Next</span>
        <span>▶</span>
      </button>
    </div>
    <div style="margin-top: 8px;">
      <button id="btnSpeedrunner" style="width: 100%; background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%); color: white; border: none; padding: 7px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 8px rgba(219, 39, 119, 0.35);">
        <span id="speedrunnerIcon">🚀</span>
        <span id="speedrunnerLabel">Start Hands-Free Auto-Pilot (All Questions)</span>
      </button>
    </div>
  </div>

  <!-- Problem Info Card -->
  <div class="problem-card">
    <div class="problem-header">
      <div id="problemTitle" class="problem-title">Detecting Task...</div>
      <span id="problemCode" class="problem-code">---</span>
    </div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <span id="langBadge" class="lang-badge">Python (main.py)</span>
      <span id="problemMeta" style="font-size: 11px; color: var(--text-muted);">Active Task</span>
    </div>
    <button id="btnSync" class="btn-sync">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      Refresh from Tab
    </button>
  </div>

  <!-- Actions -->
  <div class="actions-grid">
    <button id="btnExplain" class="action-btn">
      <span>💡</span> Explain
    </button>
    <button id="btnHints" class="action-btn">
      <span>🎯</span> Hints
    </button>
    <button id="btnApproach" class="action-btn">
      <span>⚡</span> Approach
    </button>
    <button id="btnReview" class="action-btn">
      <span>🔍</span> Review
    </button>
  </div>

  <!-- Output Log Area -->
  <div id="contentArea" class="content-area">
    <div style="color: var(--text-muted); text-align: center; padding: 15px 0;">
      Click <strong>Auto-Solve & Run</strong> to solve, write code into editor, and execute automatically.
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <a href="http://127.0.0.1:5173" target="_blank" class="app-link">
      <span>Full Workspace</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
      </svg>
    </a>
    <span style="font-size: 10px; color: var(--text-muted);">Companion Active</span>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
